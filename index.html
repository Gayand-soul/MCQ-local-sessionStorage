<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quiz-session-local storage</title>
    <link rel="stylesheet" href="quize.css">
</head>
<body>
    <div class="app">
        <h1>Simple Quiz for local & session storage</h1>
        <div class="quiz">
            <h2 id="question">Placeholder for questions</h2>
            <pre id="code-snippet" class="code-block"></pre>
            <div id="answer-btn">
                <button class="btn">Answer 1</button>
                <button class="btn">Answer 2</button>
                <button class="btn">Answer 3</button>
                <button class="btn">Answer 4</button>
            </div>
            <!--Next button----->
            <button id="next-btn">Nästa</button>

            <!--count the answered questions----->
            <div class="contorls">
                <p id="progress">Besvarade: 0 / 0</p>

                <!---Prev button-->
                <button id="prev-btn">Tillbaka</button>
            </div>



        </div>

    </div>
    
    <script src="script.js"></script>
</body>
</html>
